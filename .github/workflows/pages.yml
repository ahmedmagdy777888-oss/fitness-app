name: Deploy site with icons
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assemble site
        run: |
          set -e
          mkdir _site
          cp index.html manifest.json privacy.html supabase.js p2.js clip-*.js _site/
          cp -r .well-known _site/
          for n in apple-touch-icon icon-192; do
            base64 -d icons/$n.b64 > _site/$n.png
          done
          cat icons/icon-512.b64a icons/icon-512.b64b | base64 -d > _site/icon-512.png
          ls -la _site
      - uses: actions/configure-pages@v5
      - name: Package site (tar, includes .well-known)
        shell: bash
        run: tar --dereference --hard-dereference --directory _site -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
